services:
  backend:
    build: ./backend
    container_name: backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_BACKEND_URL=http://3.26.221.91:5000
    container_name: frontend
    restart: always
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    depends_on:
        - backend